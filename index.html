<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شلم پیک - بازی اختصاصی شلم لاری</title>

<meta name="author" content="مجتبی سخایی">
<meta name="copyright" content="تمامی حقوق مادی و معنوی، قوانین و ایده شلم پیک متعلق به سازنده است.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شلم پیک">

<style>
:root {
--bg-felt: #14532d;
--card-bg: #f8fafc;
--gold: #f59e0b;
--danger: #ef4444;
--spade: #0f172a;
--heart: #dc2626;
}
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
background: var(--bg-felt);
color: #fff;
height: 100vh;
overflow: hidden;
display: flex;
flex-direction: column;
}

header {
background: rgba(0, 0, 0, 0.7);
padding: 6px 14px;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 12px;
border-bottom: 1px solid rgba(255,255,255,0.1);
z-index: 10;
}
.score-badge { display: flex; flex-direction: column; }
.score-val { font-weight: bold; font-size: 15px; color: var(--gold); }
.trump-pill { background: #000; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--gold); font-size: 11px; }

#warning-bar {
background: var(--danger);
color: #fff;
text-align: center;
padding: 4px;
font-size: 11px;
font-weight: bold;
display: none;
z-index: 10;
}

#table {
flex: 1;
position: relative;
display: flex;
justify-content: center;
align-items: center;
}
.seat {
position: absolute;
display: flex;
flex-direction: column;
align-items: center;
font-size: 11px;
}
#seat-top { top: 8px; }
#seat-left { left: 8px; }
#seat-right { right: 8px; }

.player-badge {
background: rgba(0,0,0,0.6);
padding: 4px 8px;
border-radius: 8px;
margin-bottom: 4px;
border: 1px solid transparent;
text-align: center;
line-height: 1.3;
}
.seat.active .player-badge { border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }

.trick-area {
display: flex;
gap: 8px;
min-height: 90px;
align-items: center;
justify-content: center;
}

/* کارت‌ها */
.card {
width: 52px;
height: 76px;
background: var(--card-bg);
border-radius: 6px;
border: 1px solid #cbd5e1;
color: #0f172a;
display: flex;
flex-direction: column;
justify-content: space-between;
padding: 3px 4px;
font-weight: bold;
box-shadow: 0 4px 6px rgba(0,0,0,0.35);
cursor: pointer;
position: relative;
flex-shrink: 0;
touch-action: manipulation;
transition: transform 0.15s ease;
}
.card:active { transform: translateY(-8px); }
.card.red { color: var(--heart); }
.card.disabled { opacity: 0.35; cursor: not-allowed; }
.card.selected-bid-view { border: 2px solid var(--gold); }

.card-back {
background: #1e293b;
border: 2px solid #38bdf8;
background-image: repeating-linear-gradient(45deg, #0f172a 0, #0f172a 4px, #1e293b 4px, #1e293b 8px);
}

/* کانتینر تعهد بدون پوشاندن برگ‌ها */
#bid-bar {
position: absolute;
bottom: 115px;
background: rgba(15, 23, 42, 0.95);
border: 1px solid var(--gold);
border-radius: 12px;
padding: 8px 16px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 6px 12px rgba(0,0,0,0.5);
z-index: 50;
}
.bid-btn {
background: #334155;
color: #fff;
border: 1px solid #64748b;
width: 32px;
height: 32px;
border-radius: 6px;
font-weight: bold;
font-size: 16px;
cursor: pointer;
}
.bid-btn:active { background: var(--gold); color: #000; }
#bid-val-display { font-size: 18px; font-weight: bold; color: var(--gold); width: 24px; text-align: center; }

/* دست بازیکن پایین */
#hand-wrapper {
background: rgba(0, 0, 0, 0.5);
padding: 8px 4px 16px 4px;
position: relative;
display: flex;
flex-direction: column;
align-items: center;
}
#my-hand {
display: flex;
overflow-x: auto;
gap: 3px;
width: 100%;
justify-content: flex-start;
padding: 0 8px;
-webkit-overflow-scrolling: touch;
}

.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.85);
display: flex;
justify-content: center;
align-items: center;
z-index: 100;
padding: 20px;
}
.modal-box {
background: #0f172a;
border: 1px solid var(--gold);
border-radius: 12px;
padding: 20px;
width: 100%;
max-width: 380px;
text-align: center;
}
.btn {
background: var(--gold);
color: #000;
border: none;
padding: 10px 18px;
border-radius: 8px;
font-weight: bold;
margin: 6px 4px;
cursor: pointer;
}
.btn-danger { background: var(--danger); color: #fff; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
<div class="score-badge">
<span>تیم ما (شما و یار)</span>
<span class="score-val" id="score-t0">۰</span>
<span style="font-size:10px;" id="meta-t0">تعهد: - | دست: ۰ | هشت: ۰</span>
</div>
<div class="trump-pill">حکم: پیک ♠</div>
<div class="score-badge" style="text-align: left;">
<span>تیم حریف</span>
<span class="score-val" id="score-t1">۰</span>
<span style="font-size:10px;" id="meta-t1">تعهد: - | دست: ۰ | هشت: ۰</span>
</div>
</header>

<div id="warning-bar">هشدار: جوکر سیاه را حداکثر با ۳ برگ در دست باید بازی کنید!</div>

<div id="table">
<div class="seat" id="seat-top">
<div class="player-badge" id="badge-2">مهدی (یار)<br><span id="bids-2">تعهد: ؟</span> | دست: <span id="tricks-2">۰</span></div>
<div class="card card-back" style="width:34px; height:46px;"></div>
</div>

<div class="seat" id="seat-left">
<div class="player-badge" id="badge-1">رضا (حریف)<br><span id="bids-1">تعهد: ؟</span> | دست: <span id="tricks-1">۰</span></div>
<div class="card card-back" style="width:34px; height:46px;"></div>
</div>

<div class="trick-area" id="trick-area"></div>

<div class="seat" id="seat-right">
<div class="player-badge" id="badge-3">سینا (حریف)<br><span id="bids-3">تعهد: ؟</span> | دست: <span id="tricks-3">۰</span></div>
<div class="card card-back" style="width:34px; height:46px;"></div>
</div>

<!-- کادر شناور ثبت تعهد روی میز (برگ‌ها را نمی‌پوشاند) -->
<div id="bid-bar" class="hidden">
<span style="font-size:12px; color:var(--gold);">تعهد شما:</span>
<button class="bid-btn" onclick="stepBid(-1)">-</button>
<span id="bid-val-display">۲</span>
<button class="bid-btn" onclick="stepBid(1)">+</button>
<button class="btn" style="padding:6px 12px; font-size:12px;" onclick="confirmUserBid()">تأیید</button>
</div>
</div>

<div id="hand-wrapper">
<div style="font-size:11px; color:#cbd5e1; margin-bottom:4px; width:100%; text-align:right; padding-right:10px;">
دست شما (۱۳ برگ):
</div>
<div id="my-hand"></div>
</div>

<div class="modal hidden" id="round-modal">
<div class="modal-box">
<h3 id="round-title" style="color:var(--gold); margin-bottom:12px;">نتیجه دور</h3>
<p id="round-desc" style="font-size:13px; line-height:1.6; margin-bottom:16px;"></p>
<button class="btn" onclick="startNewRound()">شروع دور بعد</button>
<button class="btn btn-danger" onclick="openShare()">اشتراک‌گذاری بازی</button>
</div>
</div>

<script>
const SUITS = { SPADES: '♠', HEARTS: '♥', DIAMONDS: '♦', CLUBS: '♣' };

let state = {
rules: { minBid: 2, targetScore: 500, enableEight: true, eightThreshold: 8 },
teamScores: [0, 0],
teamEights: [0, 0],
players: [
{ id: 0, name: 'شما', team: 0, hand: [], bid: 0, tricks: 0, isBot: false },
{ id: 1, name: 'رضا', team: 1, hand: [], bid: 0, tricks: 0, isBot: true },
{ id: 2, name: 'مهدی', team: 0, hand: [], bid: 0, tricks: 0, isBot: true },
{ id: 3, name: 'سینا', team: 1, hand: [], bid: 0, tricks: 0, isBot: true }
],
currentTurn: 0,
dealer: 0,
trick: [],
leadSuit: null,
blackJokerPlayed: false,
phase: 'bidding',
tempUserBid: 2
};

function sortHand(hand) {
const suitOrder = { SPADES: 4, HEARTS: 3, CLUBS: 2, DIAMONDS: 1 };
return hand.sort((a, b) => {
if (a.type === 'colorJoker') return -1;
if (b.type === 'colorJoker') return 1;
if (a.type === 'blackJoker') return -1;
if (b.type === 'blackJoker') return 1;

if (suitOrder[a.suit] !== suitOrder[b.suit]) {
return suitOrder[b.suit] - suitOrder[a.suit];
}
return b.rank - a.rank;
});
}

function generateDeck() {
let deck = [];
const suits = ['SPADES', 'HEARTS', 'DIAMONDS', 'CLUBS'];
suits.forEach(suit => {
for (let r = 2; r <= 14; r++) {
if ((suit === 'HEARTS' || suit === 'DIAMONDS') && r === 2) continue;
deck.push({ id: `${suit}_${r}`, suit, rank: r, type: 'standard' });
}
});
deck.push({ id: 'JOKER_BLACK', suit: null, rank: 98, type: 'blackJoker' });
deck.push({ id: 'JOKER_COLOR', suit: null, rank: 99, type: 'colorJoker' });
return deck.sort(() => Math.random() - 0.5);
}

function initGame() {
startNewRound();
}

function startNewRound() {
document.getElementById('round-modal').classList.add('hidden');
const deck = generateDeck();
for (let i = 0; i < 4; i++) {
state.players[i].hand = sortHand(deck.slice(i * 13, (i + 1) * 13));
state.players[i].bid = 0;
state.players[i].tricks = 0;
}
state.blackJokerPlayed = false;
state.trick = [];
state.leadSuit = null;
state.phase = 'bidding';
state.currentTurn = (state.dealer + 1) % 4;
state.tempUserBid = 2;

updateUI();
runBiddingPhase();
}

function runBiddingPhase() {
updateUI();
if (state.currentTurn === 0) {
document.getElementById('bid-bar').classList.remove('hidden');
document.getElementById('bid-val-display').innerText = state.tempUserBid;
} else {
document.getElementById('bid-bar').classList.add('hidden');
setTimeout(() => {
const p = state.players[state.currentTurn];
p.bid = 2 + Math.floor(Math.random() * 2);
nextBidTurn();
}, 600);
}
}

function stepBid(step) {
state.tempUserBid = Math.max(state.rules.minBid, Math.min(state.tempUserBid + step, 13));
document.getElementById('bid-val-display').innerText = state.tempUserBid;
}

function confirmUserBid() {
state.players[0].bid = state.tempUserBid;
document.getElementById('bid-bar').classList.add('hidden');
nextBidTurn();
}

function nextBidTurn() {
state.currentTurn = (state.currentTurn + 1) % 4;
if (state.players.every(p => p.bid >= state.rules.minBid)) {
state.phase = 'playing';
state.currentTurn = (state.dealer + 1) % 4;
updateUI();
triggerTurn();
} else {
runBiddingPhase();
}
}

function triggerTurn() {
updateUI();
if (state.phase !== 'playing') return;

const p = state.players[state.currentTurn];
if (p.isBot) {
setTimeout(() => {
const valids = getValidCards(state.currentTurn);
const picked = valids[Math.floor(Math.random() * valids.length)];
executePlay(state.currentTurn, picked);
}, 700);
}
}

function getValidCards(playerIdx) {
const p = state.players[playerIdx];
if (state.trick.length === 0) {
return p.hand.filter(c => c.type === 'standard');
}

const hasLead = p.hand.some(c => c.suit === state.leadSuit);
return p.hand.filter(c => {
if (c.type === 'colorJoker') return state.blackJokerPlayed;
if (c.type === 'blackJoker') return true;
if (hasLead) return c.suit === state.leadSuit;
return true;
});
}

function userPlayCard(cardId) {
if (state.currentTurn !== 0 || state.phase !== 'playing') return;
const card = state.players[0].hand.find(c => c.id === cardId);
const valids = getValidCards(0);
if (!valids.some(c => c.id === cardId)) return;

const hasBlack = state.players[0].hand.some(c => c.type === 'blackJoker');
if (hasBlack && state.players[0].hand.length <= 3 && card.type !== 'blackJoker') {
applyViolation(0);
return;
}

executePlay(0, card);
}

function executePlay(playerIdx, card) {
const p = state.players[playerIdx];
p.hand = p.hand.filter(c => c.id !== card.id);

if (card.type === 'blackJoker') state.blackJokerPlayed = true;
if (state.trick.length === 0) state.leadSuit = card.suit;

state.trick.push({ playerId: playerIdx, card });

if (state.trick.length === 4) {
updateUI();
setTimeout(resolveTrick, 900);
} else {
state.currentTurn = (state.currentTurn + 1) % 4;
triggerTurn();
}
}

function resolveTrick() {
let winObj = state.trick[0];
for (let i = 1; i < 4; i++) {
if (compareCards(state.trick[i].card, winObj.card, state.leadSuit) > 0) {
winObj = state.trick[i];
}
}

state.players[winObj.playerId].tricks++;
state.currentTurn = winObj.playerId;
state.trick = [];
state.leadSuit = null;

if (state.players[0].hand.length === 0) {
resolveRoundEnd();
} else {
triggerTurn();
}
}

function compareCards(c1, c2, lead) {
if (c1.type === 'colorJoker') return 1;
if (c2.type === 'colorJoker') return -1;
if (c1.type === 'blackJoker') return 1;
if (c2.type === 'blackJoker') return -1;

const c1Tr = c1.suit === 'SPADES', c2Tr = c2.suit === 'SPADES';
if (c1Tr && !c2Tr) return 1;
if (!c1Tr && c2Tr) return -1;
if (c1Tr && c2Tr) return c1.rank - c2.rank;

const c1Ld = c1.suit === lead, c2Ld = c2.suit === lead;
if (c1Ld && !c2Ld) return 1;
if (!c1Ld && c2Ld) return -1;
if (c1Ld && c2Ld) return c1.rank - c2.rank;

return 0;
}

function applyViolation(teamId) {
const opp = 1 - teamId;
const violBid = state.players.filter(p => p.team === teamId).reduce((a,b)=>a+b.bid, 0);
const oppBid = state.players.filter(p => p.team === opp).reduce((a,b)=>a+b.bid, 0);

state.teamScores[teamId] -= (10 * violBid);
state.teamScores[opp] += (10 * oppBid);

showRoundModal("تخلف جوکر سیاه!", `عدم بازی جوکر سیاه تا برگ سوم. جریمه: ${-10 * violBid} امتیاز.`);
}

function resolveRoundEnd() {
let report = "";
for (let t = 0; t < 2; t++) {
const bid = state.players.filter(p => p.team === t).reduce((a,b)=>a+b.bid, 0);
const won = state.players.filter(p => p.team === t).reduce((a,b)=>a+b.tricks, 0);

if (won >= bid) {
const sc = (10 * bid) + (won - bid);
state.teamScores[t] += sc;
report += `تیم ${t === 0 ? 'ما' : 'حریف'}: تعهد ${bid}، دست ${won} ➔ ${sc} امتیاز مثبت.<br>`;
if (state.rules.enableEight && bid >= state.rules.eightThreshold) {
handleEight(t);
report += `★ هشت برتر برای تیم ${t === 0 ? 'ما' : 'حریف'} ثبت شد!<br>`;
}
} else {
const pen = -10 * bid;
state.teamScores[t] += pen;
report += `تیم ${t === 0 ? 'ما' : 'حریف'}: عدم تعهد (${won} از ${bid}) ➔ ${pen} امتیاز منفی.<br>`;
}
}

state.dealer = (state.dealer + 1) % 4;
showRoundModal("پایان دور", report);
}

function handleEight(teamId) {
const opp = 1 - teamId;
if (state.teamEights[opp] > 0) {
state.teamEights[opp]--;
} else {
state.teamEights[teamId]++;
}
}

function showRoundModal(title, text) {
state.phase = 'ended';
document.getElementById('round-title').innerText = title;
document.getElementById('round-desc').innerHTML = text;
document.getElementById('round-modal').classList.remove('hidden');
updateUI();
}

function updateUI() {
const t0Bid = state.players[0].bid + state.players[2].bid;
const t1Bid = state.players[1].bid + state.players[3].bid;
const t0Tr = state.players[0].tricks + state.players[2].tricks;
const t1Tr = state.players[1].tricks + state.players[3].tricks;

document.getElementById('score-t0').innerText = state.teamScores[0];
document.getElementById('score-t1').innerText = state.teamScores[1];
document.getElementById('meta-t0').innerText = `تعهد: ${t0Bid||'-'} | دست: ${t0Tr} | هشت: ${state.teamEights[0]}`;
document.getElementById('meta-t1').innerText = `تعهد: ${t1Bid||'-'} | دست: ${t1Tr} | هشت: ${state.teamEights[1]}`;

for(let i=1; i<=3; i++) {
document.getElementById(`tricks-${i}`).innerText = state.players[i].tricks;
document.getElementById(`bids-${i}`).innerText = state.players[i].bid ? `تعهد: ${state.players[i].bid}` : 'تعهد: ؟';
document.getElementById(`seat-${i===1?'left':i===2?'top':'right'}`).classList.toggle('active', state.currentTurn === i);
}

const myBlack = state.players[0].hand.some(c => c.type === 'blackJoker');
document.getElementById('warning-bar').style.display = (myBlack && state.players[0].hand.length <= 4) ? 'block' : 'none';

const trickEl = document.getElementById('trick-area');
trickEl.innerHTML = '';
state.trick.forEach(t => {
trickEl.appendChild(createCardUI(t.card, false));
});

const handEl = document.getElementById('my-hand');
handEl.innerHTML = '';
const valids = state.phase === 'playing' && state.currentTurn === 0 ? getValidCards(0) : [];

state.players[0].hand.forEach(c => {
const isLegal = state.phase === 'bidding' || valids.some(vc => vc.id === c.id);
const cardNode = createCardUI(c, true, isLegal);
if (state.phase === 'playing') {
cardNode.onclick = () => userPlayCard(c.id);
}
handEl.appendChild(cardNode);
});
}

function createCardUI(card, isHand, isLegal = true) {
const el = document.createElement('div');
el.className = 'card';
if (!isLegal && isHand && state.phase === 'playing') el.classList.add('disabled');

if (card.type === 'standard') {
const isRed = card.suit === 'HEARTS' || card.suit === 'DIAMONDS';
if (isRed) el.classList.add('red');
const rName = card.rank === 14 ? 'A' : card.rank === 13 ? 'K' : card.rank === 12 ? 'Q' : card.rank === 11 ? 'J' : card.rank;
el.innerHTML = `<div>${rName}</div><div style="font-size:16px; text-align:center;">${SUITS[card.suit]}</div><div style="text-align:left;">${rName}</div>`;
} else if (card.type === 'blackJoker') {
el.innerHTML = `<div style="font-size:9px;">جوکر</div><div style="font-size:11px; text-align:center;">★ سیاه</div><div style="font-size:9px; text-align:left;">JOKER</div>`;
} else {
el.classList.add('red');
el.innerHTML = `<div style="font-size:9px;">جوکر</div><div style="font-size:11px; text-align:center;">★ رنگی</div><div style="font-size:9px; text-align:left;">JOKER</div>`;
}
return el;
}

function openShare() {
if (navigator.share) {
navigator.share({
title: 'بازی شلم پیک',
text: 'شلم پیک (نسخه اختصاصی شلم لاری)',
url: window.location.href
});
} else {
alert("لینک کپی شد: " + window.location.href);
}
}

window.onload = initGame;
</script>
</body>
</html>
